name: Smarter Playlists Metadata

on:
  workflow_call:
    inputs:
      batch_size:
        description: Entities per type in each batch, not a total limit (1-100)
        type: number
        default: 50
      refresh_hours:
        description: Minimum capture age to refresh (1-168 hours)
        type: number
        default: 20
  workflow_dispatch:
    inputs:
      batch_size:
        description: Entities per type in each batch, not a total limit (1-100)
        type: number
        default: 50
      refresh_hours:
        description: Minimum capture age to refresh (1-168 hours)
        type: number
        default: 20
  repository_dispatch:
    types: [run-smarterplaylists]
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

concurrency:
  group: smarterplaylists-metadata
  cancel-in-progress: false

jobs:
  smarterplaylists:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMARTERPLAYLISTS_SESSION_COOKIE: ${{ secrets.SMARTERPLAYLISTS_SESSION_COOKIE }}
        run: |
          test -n "$DATABASE_URL"
          test -n "$SMARTERPLAYLISTS_SESSION_COOKIE"

      - name: Refresh metadata
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMARTERPLAYLISTS_SESSION_COOKIE: ${{ secrets.SMARTERPLAYLISTS_SESSION_COOKIE }}
          BATCH_SIZE: ${{ inputs.batch_size || '50' }}
          REFRESH_HOURS: ${{ inputs.refresh_hours || '20' }}
        run: >-
          spoty-enrich --provider smarterplaylists --all
          --batch-size "$BATCH_SIZE" --refresh-hours "$REFRESH_HOURS" --max-minutes 300
