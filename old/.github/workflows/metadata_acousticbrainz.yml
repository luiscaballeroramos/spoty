name: AcousticBrainz Metadata

on:
  workflow_call:
  workflow_dispatch:
  repository_dispatch:
    types: [run-acousticbrainz-enrichment]

permissions:
  contents: read

concurrency:
  group: metadata-acousticbrainz
  cancel-in-progress: false

jobs:
  acousticbrainz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Enrich AcousticBrainz metadata
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: spoty-enrich --provider acousticbrainz --limit 50
