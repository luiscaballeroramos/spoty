name: Tests and quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: >-
          python -m compileall -q
            app_views services register spotifyapi streamlit_lab tests examples
          streamlit_app.py config.py

          - name: Build and smoke-test installed wheel
          env:
            SPOTY_WHEEL_DIR: ${{ runner.temp }}/spoty-wheel
            SPOTY_INSTALL_DIR: ${{ runner.temp }}/spoty-install
          run: |
            python -m pip wheel . --no-deps --wheel-dir "$SPOTY_WHEEL_DIR"
            python -m pip install --no-deps --target "$SPOTY_INSTALL_DIR" "$SPOTY_WHEEL_DIR"/spoty-*.whl
            cd "$RUNNER_TEMP"
            PYTHONPATH="$SPOTY_INSTALL_DIR" python - <<'PY'
            import importlib.metadata
            import psycopg
            import requests
            from unittest.mock import patch

            with (
              patch.object(psycopg, "connect", side_effect=AssertionError("import opened a DB connection")),
              patch.object(requests.sessions.Session, "request", side_effect=AssertionError("import made an HTTP request")),
            ):
              import _currently_playing
              import _liked_tracks
              import _print
              import _print_summary
              import _registration
              import app_views.reproduction
              import app_views.summary
              import services.summary_queries
              import spotifyapi.spotifyclient
              import streamlit_lab.renderer

            distribution = importlib.metadata.distribution("spoty")
            commands = {
              entry_point.name
              for entry_point in distribution.entry_points
              if entry_point.group == "console_scripts"
            }
            expected = {
              "spoty-register",
              "spoty-currently-playing",
              "spoty-sync-liked",
              "spoty-print-summary",
              "spoty-print-liked",
            }
            assert expected <= commands, f"Missing console commands: {expected - commands}"
            PY
      - name: Test product services and UI
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s tests -p 'test_*.py' -v

