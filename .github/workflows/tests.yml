name: Tests and quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            streamlit_lab/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: >-
          python -m compileall -q
          app_views services register spotifyapi streamlit_lab tests
          streamlit_app.py config.py

      - name: Test reproduction
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s tests -p test_reproduction.py -v

      - name: Test layout and demo
        if: ${{ !cancelled() }}
        run: python -m unittest streamlit_lab.test_blocks -v
