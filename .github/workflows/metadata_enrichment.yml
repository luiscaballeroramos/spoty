name: Metadata Enrichment

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [run-metadata-enrichment]

permissions:
  contents: read

concurrency:
  group: metadata-enrichment
  cancel-in-progress: false

jobs:
  metadata-enrichment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run metadata enrichment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          MUSICBRAINZ_USER_AGENT: "Spoty/0.1.0 (metadata enrichment via GitHub Actions)"
        run: spoty-enrich --limit 50