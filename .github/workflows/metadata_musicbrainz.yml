name: MusicBrainz Metadata

on:
  workflow_call:
  workflow_dispatch:
  repository_dispatch:
    types: [run-musicbrainz-enrichment]

permissions:
  contents: read

concurrency:
  group: metadata-musicbrainz
  cancel-in-progress: false

jobs:
  musicbrainz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Enrich MusicBrainz metadata
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MUSICBRAINZ_USER_AGENT: "Spoty/0.1.0 (https://github.com/luiscaballeroramos/spoty)"
        run: spoty-enrich --provider musicbrainz --limit 50
